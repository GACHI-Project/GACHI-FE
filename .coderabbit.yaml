# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'ko-KR'
tone_instructions: >-
  문제의 발생 조건과 영향을 근거와 함께 설명해 주세요.
  확인된 문제와 추가 확인이 필요한 사항을 구분해 주세요.

reviews:
  profile: 'chill'
  request_changes_workflow: false

  high_level_summary: true
  review_status: true
  review_details: true
  collapse_walkthrough: true

  poem: false

  pre_merge_checks:
    docstrings:
      mode: 'off'

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - '^develop$'
      - '^main$'

chat:
  auto_reply: true
